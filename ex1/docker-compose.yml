version: "3.9"

services:
  storage:
    build: ./storage
    container_name: storage
    environment:
      - LOG_PATH=/data/log.txt
    volumes:
      - storage:/data
    networks:
      - backend

  service2:
    build: ./service2
    container_name: service2
    environment:
      - STORAGE_URL=http://storage:8080
      - VSTORAGE_PATH=/var/vstorage/log.txt
    volumes:
      - ./vstorage:/var/vstorage/log.txt
    networks:
      - backend

  service1:
    build: ./service1
    container_name: service1
    environment:
      - STORAGE_URL=http://storage:8080
      - SERVICE2_URL=http://service2:3000
      - VSTORAGE_PATH=/var/vstorage/log.txt
    volumes:
      - ./vstorage:/var/vstorage/log.txt
    ports:
      - "8199:8000"   # Service1 is the only exposed service
    networks:
      - backend

volumes:
  storage:  # Persistent volume for storage service

networks:
  backend:
    driver: bridge